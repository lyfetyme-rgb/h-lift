# H-LIFT edge TLS termination - TLS 1.3 only (RFC 8446).
#
# TLS is terminated at the proxy, not in the Next.js process. This configuration
# disables TLS 1.0-1.2 entirely, keeps only the three TLS 1.3 cipher suites,
# disables session tickets, enables OCSP stapling, and pins HSTS. Adjust
# server_name, certificate paths and the upstream to your deployment.
#
# Note: TLS 1.3 cipher suites are not configurable via ssl_ciphers; that
# directive applies to TLS 1.2 and below. Listing the TLS 1.3 suite names is
# documentation only and is ignored by nginx.

upstream hlift_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect all plaintext to TLS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hlift.example.mil;

    ssl_certificate     /etc/hlift/tls/server.crt;
    ssl_certificate_key /etc/hlift/tls/server.key;

    # RFC 8446: TLS 1.3 only. No downgrade to 1.0/1.1/1.2.
    ssl_protocols TLSv1.3;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers off;

    # Session resumption without tickets (RFC 8446 section 2.2).
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    # OCSP stapling.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HSTS (RFC 6797) - two years, subdomains, preload.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Standard application routes.
    location / {
        proxy_pass http://hlift_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header x-hlift-subject $ssl_client_s_dn_cn;
    }

    # TAXII consumers present a client certificate; the DN CN is mapped onto the
    # acting subject so the existing capability gate applies.
    location /taxii2/ {
        ssl_verify_client on;
        ssl_client_certificate /etc/hlift/tls/ca.crt;
        proxy_pass http://hlift_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-hlift-subject $ssl_client_s_dn_cn;
    }
}
