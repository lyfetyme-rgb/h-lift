name: H-LIFT CI

on:
  push:
    branches: [main, dev, production]
  pull_request:
    branches: [main, dev, production]

jobs:
  verify:
    name: Typecheck, build and seed verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Seed verification
        run: |
          npm run db:reset
          npm run db:verify

      - name: Upload build (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          if-no-files-found: ignore

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: h-lift:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: npm audit
        run: npm audit --audit-level=high || true
